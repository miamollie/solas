global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "solas"
    metrics_path: /metrics
    static_configs:
      - targets: ["solas:8000"]

  - job_name: "cadvisor"
    metrics_path: /metrics
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "node_exporter"
    metrics_path: /metrics
    static_configs:
      - targets: ["node-exporter:9100"]


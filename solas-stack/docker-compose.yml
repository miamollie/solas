services:
  solas:
    build:
      context: ..
      dockerfile: Dockerfile
    image: solas:local
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_started
    environment:
      SOLAS_OLLAMA_BASE_URL: http://ollama:11434
      SOLAS_OLLAMA_CONTAINER_NAME: ollama
    healthcheck:
      test:
        [
          "CMD",
          "/busybox",
          "sh",
          "-c",
          "/busybox wget -qO- http://127.0.0.1:8000/health >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  # Cadvisor is a container monitoring tool that exposes metrics about the host and running containers to Prometheus. It runs as a container and mounts the root filesystem, Docker socket, and other necessary directories as read-only.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8080:8080"
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/var/ollama
    restart: unless-stopped

    # Node exporter exposes host metrics to Prometheus. It runs in host network mode and mounts the root filesystem as read-only.
  node-exporter:
    image: quay.io/prometheus/node-exporter:latest
    container_name: node_exporter
    command:
      - "--path.rootfs=/host"
    network_mode: host
    pid: host
    restart: unless-stopped
    volumes:
      - "/:/host:ro,rslave"

  prometheus:
    image: prom/prometheus:latest
    depends_on:
      solas:
        condition: service_healthy
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:latest
    depends_on:
      - prometheus
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    depends_on:
      - solas
    ports:
      - "3000:8080"
    environment:
      OPENAI_API_BASE_URL: http://solas:8000/v1
      OPENAI_API_KEY: solas
    volumes:
      - open-webui-data:/app/backend/data
    labels:
      solas.ui.url: "http://localhost:3000"

volumes:
  grafana-data:
  prometheus-data:
  open-webui-data:
  ollama-data:
